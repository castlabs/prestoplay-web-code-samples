<!DOCTYPE html>
<html lang="en">

<head>
  <title>Custom plugin</title>
  <link rel="icon" href="data:;base64,iVBORw0KGgo=">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../node_modules/@castlabs/prestoplay/clpp.styles.css">
  <link rel="stylesheet" href="../styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mux.js/6.3.0/mux.min.js" integrity="sha512-mC7/Okc2DQtEIn42I2mpODmNX3NSPrMiAhQt6ua3GsdMe1PRV77EjszmNdhfCriykcsPjd6omd+ZJPdXMxGGkA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <style>
    .clpp-container {
      position: relative;
    }

    .stats-overlay {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 10;
      min-width: 220px;
      padding: 10px 12px;
      font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #fff;
      background: rgba(0, 0, 0, 0.7);
      border-radius: 6px;
      pointer-events: none;
    }

    .stats-overlay[hidden] {
      display: none;
    }

    .stats-overlay dl {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0 12px;
      margin: 0;
    }

    .stats-overlay dt {
      color: #aaa;
    }

    .stats-overlay dd {
      margin: 0;
    }

    .stats-overlay ol {
      margin: 8px 0 0;
      padding: 8px 0 0 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      color: #aaa;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "@castlabs/prestoplay": "../../node_modules/@castlabs/prestoplay/cl.core.js",
        "@castlabs/prestoplay/cl.mse": "../../node_modules/@castlabs/prestoplay/cl.mse.js",
        "@castlabs/prestoplay/cl.dash": "../../node_modules/@castlabs/prestoplay/cl.dash.js",
        "@castlabs/prestoplay/cl.hls": "../../node_modules/@castlabs/prestoplay/cl.hls.js"
      }
    }
  </script>
  <script type="module" src="../components/prestoplay-header.js"></script>
  <script type="module" src="./stats_overlay.js"></script>
</head>

<body>
  <prestoplay-header back-href="../../index.html"></prestoplay-header>
  <div class="page">
    <h1>Custom plugin</h1>
    <p class="description">Example of a custom player plugin that renders a stats overlay and shows when each plugin lifecycle callback runs. Load a stream, then load another one to see the plugin release and set up again.</p>
    <div>
      <video id="video" controls crossorigin="anonymous" playsinline></video>
    </div>
    <div class="controls">
      <input type="text" id="sourceUrl" value="https://demo.cf.castlabs.com/media/prestodash/Manifest.mpd">
      <button id="loadButton">Load</button>
      <button id="toggleButton">Toggle stats</button>
    </div>
  </div>
</body>
</html>
