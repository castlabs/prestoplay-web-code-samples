<!DOCTYPE html>
<html lang="en">

<head>
  <title>Player events</title>
  <link rel="icon" href="data:;base64,iVBORw0KGgo=">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../node_modules/@castlabs/prestoplay/clpp.styles.css">
  <link rel="stylesheet" href="../styles.css">
  <style>
    .toggle {
      display: flex;
      gap: 6px;
      align-items: center;
      font-size: 0.9rem;
    }

    .log {
      margin: 20px 0 0;
      padding: 0;
      list-style: none;
      max-height: 280px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .log li {
      padding: 6px 12px;
      border-bottom: 1px solid var(--border);
      overflow-wrap: anywhere;
    }

    .log li:last-child {
      border-bottom: none;
    }

    .log .event {
      font-weight: 600;
    }

    .log .detail {
      color: var(--muted);
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "@castlabs/prestoplay": "../../node_modules/@castlabs/prestoplay/cl.core.js",
        "@castlabs/prestoplay/cl.mse": "../../node_modules/@castlabs/prestoplay/cl.mse.js",
        "@castlabs/prestoplay/cl.dash": "../../node_modules/@castlabs/prestoplay/cl.dash.js"
      }
    }
  </script>
  <script type="module" src="../components/prestoplay-header.js"></script>
  <script type="module" src="./player_events.js"></script>
</head>

<body>
  <prestoplay-header back-href="../../index.html"></prestoplay-header>
  <div class="page">
    <h1>Player events</h1>
    <p class="description">Example of HTML5 media events and PRESTOplay events (<code>clpp.events</code>): state changes, buffering, tracks, bitrate changes, and release. Play, pause, seek, and switch quality to see more events.</p>
    <div>
      <video id="video" controls crossorigin="anonymous" playsinline></video>
    </div>
    <div class="controls">
      <button id="loadButton">Load</button>
      <button id="releaseButton">Release</button>
      <label class="toggle"><input type="checkbox" id="timeupdateToggle"> Log timeupdate</label>
    </div>
    <ul class="log" id="log"></ul>
  </div>
</body>
</html>
