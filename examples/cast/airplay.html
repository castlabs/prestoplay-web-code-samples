<!DOCTYPE html>
<html lang="en">

<head>
  <title>AirPlay</title>
  <link rel="icon" href="data:;base64,iVBORw0KGgo=">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../node_modules/@castlabs/prestoplay/clpp.styles.css">
  <link rel="stylesheet" href="../styles.css">
  <style>
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      margin: 20px 0 0;
      font-size: 0.9rem;
      color: var(--muted);
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mux.js/6.3.0/mux.min.js" integrity="sha512-mC7/Okc2DQtEIn42I2mpODmNX3NSPrMiAhQt6ua3GsdMe1PRV77EjszmNdhfCriykcsPjd6omd+ZJPdXMxGGkA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script type="importmap">
    {
      "imports": {
        "@castlabs/prestoplay": "../../node_modules/@castlabs/prestoplay/cl.core.js",
        "@castlabs/prestoplay/cl.mse": "../../node_modules/@castlabs/prestoplay/cl.mse.js",
        "@castlabs/prestoplay/cl.hls": "../../node_modules/@castlabs/prestoplay/cl.hls.js",
        "@castlabs/prestoplay/cl.airplay": "../../node_modules/@castlabs/prestoplay/cl.airplay.js"
      }
    }
  </script>
  <script type="module" src="../components/prestoplay-header.js"></script>
  <script type="module" src="./airplay.js"></script>
</head>

<body>
  <prestoplay-header back-href="../../index.html"></prestoplay-header>
  <div class="page">
    <h1>AirPlay</h1>
    <p class="description">Example of playing HLS on an AirPlay device. Open this page in Safari with an AirPlay device on the same network.</p>
    <div>
      <video id="video" controls crossorigin="anonymous" playsinline></video>
    </div>
    <div class="controls">
      <button id="airplayButton" disabled>AirPlay</button>
    </div>
    <p class="status"><span id="availability">Checking for AirPlay devices.</span> <span id="casting"></span></p>
  </div>
</body>
</html>
