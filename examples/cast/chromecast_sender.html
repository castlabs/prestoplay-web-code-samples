<!DOCTYPE html>
<html lang="en">

<head>
  <title>Chromecast sender</title>
  <link rel="icon" href="data:;base64,iVBORw0KGgo=">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../node_modules/@castlabs/prestoplay/clpp.styles.css">
  <link rel="stylesheet" href="../styles.css">
  <style>
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      margin: 20px 0 0;
      font-size: 0.9rem;
      color: var(--muted);
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "@castlabs/prestoplay": "../../node_modules/@castlabs/prestoplay/cl.core.js",
        "@castlabs/prestoplay/cl.mse": "../../node_modules/@castlabs/prestoplay/cl.mse.js",
        "@castlabs/prestoplay/cl.dash": "../../node_modules/@castlabs/prestoplay/cl.dash.js",
        "@castlabs/prestoplay/cl.cast": "../../node_modules/@castlabs/prestoplay/cl.cast.js"
      }
    }
  </script>
  <script type="module" src="../components/prestoplay-header.js"></script>
  <script type="module" src="./chromecast_sender.js"></script>
</head>

<body>
  <prestoplay-header back-href="../../index.html"></prestoplay-header>
  <div class="page">
    <h1>Chromecast sender</h1>
    <p class="description">Example of casting to a Chromecast device. Needs Chrome or Edge, a Cast device on the same network, and a receiver app ID (see TODO).</p>
    <div>
      <video id="video" controls crossorigin="anonymous" playsinline></video>
    </div>
    <div class="controls">
      <button id="castButton" disabled>Cast</button>
      <button id="playPauseButton">Play/Pause</button>
    </div>
    <p class="status" id="status">Loading the Cast SDK.</p>
  </div>
</body>
</html>
