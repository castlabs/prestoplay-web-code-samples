<!DOCTYPE html>
<html lang="en">

<head>
  <title>Conviva analytics</title>
  <link rel="icon" href="data:;base64,iVBORw0KGgo=">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../node_modules/@castlabs/prestoplay/clpp.styles.css">
  <link rel="stylesheet" href="../styles.css">
  <!--
    TODO: Conviva provides the Conviva Core SDK (version 4.0.3 or later)
    directly to customers; it isn't published on NPM. Add it to the page before
    the PRESTOplay Conviva plugin is used.
  -->
  <script src="TODO/path/to/conviva-core-sdk.js"></script>
  <script type="importmap">
    {
      "imports": {
        "@castlabs/prestoplay": "../../node_modules/@castlabs/prestoplay/cl.core.js",
        "@castlabs/prestoplay/cl.mse": "../../node_modules/@castlabs/prestoplay/cl.mse.js",
        "@castlabs/prestoplay/cl.dash": "../../node_modules/@castlabs/prestoplay/cl.dash.js",
        "@castlabs/prestoplay/cl.conviva": "../../node_modules/@castlabs/prestoplay/cl.conviva.js"
      }
    }
  </script>
  <script type="module" src="../components/prestoplay-header.js"></script>
  <script type="module">
    import {clpp} from "@castlabs/prestoplay"
    import "@castlabs/prestoplay/cl.mse"
    import "@castlabs/prestoplay/cl.dash"
    import "@castlabs/prestoplay/cl.conviva"

    const defaultSource = {
      name: 'DASH VoD Clear',
      url: 'https://demo.cf.castlabs.com/media/prestodash/Manifest.mpd'
    };

    clpp.log.setLogLevel(clpp.log.Level.INFO);
    clpp.install(clpp.dash.DashComponent);

    const videoEl = document.getElementById('video');
    const containerEl = videoEl.parentElement;
    const player = new clpp.Player(videoEl, {
      conviva: {
        // Fill in the customer key and gateway URL from your Conviva account.
        customerKey: 'TODO',
        // Use the test gateway URL during development. Omit it in production.
        serviceUrl: 'https://TODO.testonly.conviva.com',
        viewerId: 'example-viewer',
        playerName: 'PRESTOplay code samples',
        // Report additional metadata with every session.
        customTags: {
          page: 'code-samples',
        },
        // Set to true to also report client-side ads to Conviva Ad Insights.
        enableAdInsights: false,
      }
    }, { containerEl });

    const sourceUrlEl = document.getElementById('sourceUrl');

    document.getElementById('loadButton').addEventListener('click', () => {
      player.open({
        source: {
          url: sourceUrlEl.value,
          type: clpp.Type.DASH,
          // Reported as the asset name by the integration.
          name: defaultSource.name
        },
        autoplay: true,
      });
    });

    player.on('error', event => {
      const error = event.detail;
      if (error) {
        console.warn('Error:', error);
      }
    });
  </script>
</head>

<body>
  <prestoplay-header back-href="../../index.html"></prestoplay-header>
  <div class="page">
    <h1>Conviva analytics</h1>
    <p class="description">Example of basic DASH playback with Conviva analytics enabled.</p>
    <div>
      <video id="video" controls crossorigin="anonymous" playsinline></video>
    </div>
    <div class="controls">
      <input type="text" id="sourceUrl" value="https://demo.cf.castlabs.com/media/prestodash/Manifest.mpd">
      <button id="loadButton">Load</button>
    </div>
  </div>
</body>

</html>
