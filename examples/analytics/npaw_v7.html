<!DOCTYPE html>
<html lang="en">

<head>
  <title>NPAW v7 analytics</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:;base64,iVBORw0KGgo=">
  <link rel="stylesheet" href="../../node_modules/@castlabs/prestoplay/clpp.styles.css">
  <link rel="stylesheet" href="../styles.css">
  <script src="https://artifact.plugin.npaw.com/artifactory/plugins/js/7.3.21/NpawPlugin-es5.js"></script>
  <script src="https://artifact.plugin.npaw.com/artifactory/plugins/js/7.3.21/NpawPluginAdapters-es5.js"></script>
  <script type="importmap">
    {
      "imports": {
        "@castlabs/prestoplay": "../../node_modules/@castlabs/prestoplay/cl.core.js",
        "@castlabs/prestoplay/cl.mse": "../../node_modules/@castlabs/prestoplay/cl.mse.js",
        "@castlabs/prestoplay/cl.dash": "../../node_modules/@castlabs/prestoplay/cl.dash.js",
        "@castlabs/prestoplay/cl.youbora": "../../node_modules/@castlabs/prestoplay/cl.youbora.js"
      }
    }
  </script>
  <script type="module" src="../components/prestoplay-header.js"></script>
  <script type="module" src="./npaw_v7.js"></script>
</head>

<body>
  <prestoplay-header back-href="../../index.html"></prestoplay-header>
  <div class="page">
    <h1>NPAW v7 analytics</h1>
    <p class="description">Example of basic DASH playback with NPAW v7 analytics enabled.</p>
    <p class="description">Enter the account code from your NPAW account, then load the stream.</p>
    <p class="description">Open the browser DevTools Network tab and filter for <code>youbora</code> to inspect analytics requests.</p>
    <!-- The player adds clpp-container when it is created. Setting it here
         keeps the video styled before the first Load. -->
    <div class="clpp-container">
      <video id="video" crossorigin="anonymous" playsinline></video>
    </div>
    <form id="loadForm">
      <div class="settings">
        <label for="accountCode">Account code</label>
        <input type="text" id="accountCode" required autocomplete="off">
      </div>
      <div class="controls">
        <input type="text" id="sourceUrl" value="https://demo.cf.castlabs.com/media/prestodash/Manifest.mpd">
        <button type="submit">Load</button>
      </div>
    </form>
    <div class="controls">
      <span>Test out the error filter:</span>
      <button id="triggerRecoverableErrorButton">Trigger recoverable error</button>
      <button id="triggerFatalErrorButton">Trigger fatal error</button>
    </div>
  </div>
</body>

</html>
