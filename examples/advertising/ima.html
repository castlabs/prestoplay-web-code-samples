<!DOCTYPE html>
<html lang="en">

<head>
  <title>Google IMA ads</title>
  <link rel="icon" href="data:;base64,iVBORw0KGgo=">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../node_modules/@castlabs/prestoplay/clpp.styles.css">
  <link rel="stylesheet" href="../styles.css">
  <style>
    .ad-log {
      margin: 20px 0 0;
      padding: 0;
      list-style: none;
      max-height: 240px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .ad-log li {
      padding: 6px 12px;
      border-bottom: 1px solid var(--border);
    }

    .ad-log li:last-child {
      border-bottom: none;
    }

    .ad-log .event {
      font-weight: 600;
    }

    .ad-log .detail {
      color: var(--muted);
    }
  </style>
  <!-- The Google IMA SDK must be loaded before the PRESTOplay IMA plugin is used. -->
  <script src="https://imasdk.googleapis.com/js/sdkloader/ima3.js"></script>
  <script type="importmap">
    {
      "imports": {
        "@castlabs/prestoplay": "../../node_modules/@castlabs/prestoplay/cl.core.js",
        "@castlabs/prestoplay/cl.mse": "../../node_modules/@castlabs/prestoplay/cl.mse.js",
        "@castlabs/prestoplay/cl.dash": "../../node_modules/@castlabs/prestoplay/cl.dash.js",
        "@castlabs/prestoplay/cl.ima": "../../node_modules/@castlabs/prestoplay/cl.ima.js"
      }
    }
  </script>
  <script type="module" src="../components/prestoplay-header.js"></script>
  <script type="module" src="./ima.js"></script>
</head>

<body>
  <prestoplay-header back-href="../../index.html"></prestoplay-header>
  <div class="page">
    <h1>Google IMA ads</h1>
    <p class="description">Example of DASH playback with client-side pre-roll, mid-roll, and post-roll ads from a Google Interactive Media Ads (IMA) VMAP ad tag.</p>
    <p class="description">Ad blockers prevent the IMA SDK from loading. Disable them for this page.</p>
    <div>
      <video id="video" controls crossorigin="anonymous" playsinline></video>
    </div>
    <div class="controls">
      <input type="text" id="sourceUrl" value="https://demo.cf.castlabs.com/media/prestodash/Manifest.mpd">
      <button id="loadButton">Load</button>
    </div>
    <ul id="adLog" class="ad-log"></ul>
  </div>
</body>
</html>
