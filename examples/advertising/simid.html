<!DOCTYPE html>
<html lang="en">

<head>
  <title>SIMID interactive ads</title>
  <link rel="icon" href="data:;base64,iVBORw0KGgo=">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../node_modules/@castlabs/prestoplay/clpp.styles.css">
  <link rel="stylesheet" href="../styles.css">
  <style>
    .ad-log {
      margin: 20px 0 0;
      padding: 0;
      list-style: none;
      max-height: 240px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .ad-log li {
      padding: 6px 12px;
      border-bottom: 1px solid var(--border);
    }

    .ad-log li:last-child {
      border-bottom: none;
    }

    .ad-log .event {
      font-weight: 600;
    }

    .ad-log .detail {
      color: var(--muted);
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "@castlabs/prestoplay": "../../node_modules/@castlabs/prestoplay/cl.core.js",
        "@castlabs/prestoplay/cl.mse": "../../node_modules/@castlabs/prestoplay/cl.mse.js",
        "@castlabs/prestoplay/cl.dash": "../../node_modules/@castlabs/prestoplay/cl.dash.js",
        "@castlabs/prestoplay/cl.simid": "../../node_modules/@castlabs/prestoplay/cl.simid.js"
      }
    }
  </script>
  <script type="module" src="../components/prestoplay-header.js"></script>
  <script type="module" src="./simid.js"></script>
</head>

<body>
  <prestoplay-header back-href="../../index.html"></prestoplay-header>
  <div class="page">
    <h1>SIMID interactive ads</h1>
    <p class="description">Example of SIMID interactive ads: L-banner creatives that shrink the video into a corner at 5 s, 20 s, and 30 s of the content, for 5 seconds each.</p>
    <div>
      <video id="video" controls crossorigin="anonymous" playsinline></video>
    </div>
    <ul id="adLog" class="ad-log"></ul>
  </div>
</body>
</html>
