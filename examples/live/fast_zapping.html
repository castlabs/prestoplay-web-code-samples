<!DOCTYPE html>
<html lang="en">

<head>
  <title>Fast channel zapping</title>
  <link rel="icon" href="data:;base64,iVBORw0KGgo=">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../node_modules/@castlabs/prestoplay/clpp.styles.css">
  <link rel="stylesheet" href="../styles.css">
  <style>
    /* The playlist positions its anchor absolutely, so the screen holds it. */
    .screen {
      position: relative;
      width: 105%;
      margin-left: -2.5%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: -4px 4px 18px rgba(0, 0, 0, 0.6);
    }

    #video-anchor {
      inset: 0;
    }

    /* Each preloaded channel has its own player container. */
    .screen .clpp-container {
      width: 100%;
      height: 100%;
      margin: 0;
      aspect-ratio: auto;
      border-radius: 0;
      box-shadow: none;
    }

    .screen video {
      width: 100%;
      height: 100%;
    }

    .screen #startButton {
      position: absolute;
      inset: 50% auto auto 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
    }

    .channels {
      margin: 20px 0 0;
      padding: 0;
      list-style: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      background: var(--surface);
      counter-reset: item;
    }

    .channels li {
      display: flex;
      gap: 12px;
      align-items: baseline;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }

    .channels li:last-child {
      border-bottom: none;
    }

    .channels li::before {
      counter-increment: item;
      content: counter(item);
      color: var(--muted);
      min-width: 1em;
    }

    .channels li.active {
      font-weight: 600;
      color: var(--accent);
    }

    .channels .state {
      margin-left: auto;
      color: var(--muted);
      font-weight: 400;
      font-size: 0.8rem;
    }

    .zap-time {
      font: 600 1rem ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "@castlabs/prestoplay": "../../node_modules/@castlabs/prestoplay/cl.core.js",
        "@castlabs/prestoplay/cl.mse": "../../node_modules/@castlabs/prestoplay/cl.mse.js",
        "@castlabs/prestoplay/cl.dash": "../../node_modules/@castlabs/prestoplay/cl.dash.js"
      }
    }
  </script>
  <script type="module" src="../components/prestoplay-header.js"></script>
  <script type="module" src="./fast_zapping.js"></script>
</head>

<body>
  <prestoplay-header back-href="../../index.html"></prestoplay-header>
  <div class="page">
    <h1>Fast channel zapping</h1>
    <p class="description">Example of fast switching between live DASH channels with the experimental multi-controller playlist (<code>McPlaylist</code>), which preloads the previous and next channel. Use the buttons or the up and down arrow keys.</p>
    <div class="screen">
      <div id="video-anchor"></div>
      <button id="startButton">Start watching</button>
    </div>
    <div class="controls">
      <button id="previousButton">Previous channel</button>
      <button id="nextButton">Next channel</button>
      <span>Zap time: <span id="zapTime" class="zap-time">--</span></span>
    </div>
    <ul id="channels" class="channels"></ul>
  </div>
</body>
</html>
