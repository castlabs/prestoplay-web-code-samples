<!DOCTYPE html>
<html lang="en">

<head>
  <title>Request and response modifiers</title>
  <link rel="icon" href="data:;base64,iVBORw0KGgo=">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../node_modules/@castlabs/prestoplay/clpp.styles.css">
  <link rel="stylesheet" href="../styles.css">
  <style>
    .log {
      margin: 20px 0 0;
      padding: 0;
      list-style: none;
      max-height: 280px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .log li {
      padding: 6px 12px;
      border-bottom: 1px solid var(--border);
      overflow-wrap: anywhere;
    }

    .log li:last-child {
      border-bottom: none;
    }

    .log .event {
      font-weight: 600;
    }

    .log .detail {
      color: var(--muted);
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "@castlabs/prestoplay": "../../node_modules/@castlabs/prestoplay/cl.core.js",
        "@castlabs/prestoplay/cl.mse": "../../node_modules/@castlabs/prestoplay/cl.mse.js",
        "@castlabs/prestoplay/cl.dash": "../../node_modules/@castlabs/prestoplay/cl.dash.js",
        "@castlabs/prestoplay/cl.ttml": "../../node_modules/@castlabs/prestoplay/cl.ttml.js"
      }
    }
  </script>
  <script type="module" src="../components/prestoplay-header.js"></script>
  <script type="module" src="./request_modifiers.js"></script>
</head>

<body>
  <prestoplay-header back-href="../../index.html"></prestoplay-header>
  <div class="page">
    <h1>Request and response modifiers</h1>
    <p class="description">Example of changing network requests and responses: an async auth header, a segment query parameter, a manifest rewrite and a response log.</p>
    <div>
      <video id="video" controls crossorigin="anonymous" playsinline></video>
    </div>
    <div class="controls">
      <button id="stopLoggingButton">Stop logging responses</button>
    </div>
    <ul class="log" id="log"></ul>
  </div>
</body>
</html>
