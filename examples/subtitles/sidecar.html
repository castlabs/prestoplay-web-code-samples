<!DOCTYPE html>
<html lang="en">

<head>
  <title>WebVTT and TTML subtitles</title>
  <link rel="icon" href="data:;base64,iVBORw0KGgo=">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../node_modules/@castlabs/prestoplay/clpp.styles.css">
  <link rel="stylesheet" href="../styles.css">
  <style>
    select {
      padding: 8px 10px;
      font-size: 14px;
      font-family: inherit;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mux.js/6.3.0/mux.min.js" integrity="sha512-mC7/Okc2DQtEIn42I2mpODmNX3NSPrMiAhQt6ua3GsdMe1PRV77EjszmNdhfCriykcsPjd6omd+ZJPdXMxGGkA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script type="importmap">
    {
      "imports": {
        "@castlabs/prestoplay": "../../node_modules/@castlabs/prestoplay/cl.core.js",
        "@castlabs/prestoplay/cl.mse": "../../node_modules/@castlabs/prestoplay/cl.mse.js",
        "@castlabs/prestoplay/cl.dash": "../../node_modules/@castlabs/prestoplay/cl.dash.js",
        "@castlabs/prestoplay/cl.hls": "../../node_modules/@castlabs/prestoplay/cl.hls.js",
        "@castlabs/prestoplay/cl.vtt": "../../node_modules/@castlabs/prestoplay/cl.vtt.js",
        "@castlabs/prestoplay/cl.ttml": "../../node_modules/@castlabs/prestoplay/cl.ttml.js",
        "@castlabs/prestoplay/cl.htmlcue": "../../node_modules/@castlabs/prestoplay/cl.htmlcue.js"
      }
    }
  </script>
  <script type="module" src="../components/prestoplay-header.js"></script>
  <script type="module" src="./sidecar.js"></script>
</head>

<body>
  <prestoplay-header back-href="../../index.html"></prestoplay-header>
  <div class="page">
    <h1>WebVTT and TTML subtitles</h1>
    <p class="description">Example of side-loaded WebVTT and TTML subtitle files for DASH and HLS streams.</p>
    <div>
      <video id="video" controls crossorigin="anonymous" playsinline></video>
    </div>
    <div class="controls">
      <select id="configSelect">
        <option value="webvtt_dash">WebVTT with DASH</option>
        <option value="webvtt_hls">WebVTT with HLS</option>
        <option value="ttml_dash">TTML with DASH</option>
        <option value="ttml_hls">TTML with HLS</option>
      </select>
      <button id="loadButton">Load</button>
    </div>
  </div>
</body>
</html>
