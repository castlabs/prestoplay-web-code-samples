<!DOCTYPE html>
<html lang="en">

<head>
  <title>SRT subtitles</title>
  <link rel="icon" href="data:;base64,iVBORw0KGgo=">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../node_modules/@castlabs/prestoplay/clpp.styles.css">
  <link rel="stylesheet" href="../styles.css">
  <script type="importmap">
    {
      "imports": {
        "@castlabs/prestoplay": "../../node_modules/@castlabs/prestoplay/cl.core.js",
        "@castlabs/prestoplay/cl.mse": "../../node_modules/@castlabs/prestoplay/cl.mse.js",
        "@castlabs/prestoplay/cl.dash": "../../node_modules/@castlabs/prestoplay/cl.dash.js",
        "@castlabs/prestoplay/cl.vtt": "../../node_modules/@castlabs/prestoplay/cl.vtt.js",
        "@castlabs/prestoplay/cl.htmlcue": "../../node_modules/@castlabs/prestoplay/cl.htmlcue.js"
      }
    }
  </script>
  <script type="module" src="../components/prestoplay-header.js"></script>
  <script type="module">
    import {clpp} from "@castlabs/prestoplay"
    import "@castlabs/prestoplay/cl.mse"
    import "@castlabs/prestoplay/cl.dash"
    // The VTT module parses WebVTT and SubRip (SRT) subtitles.
    import "@castlabs/prestoplay/cl.vtt"
    // The HTML text displayer renders cues consistently across browsers.
    import "@castlabs/prestoplay/cl.htmlcue"

    clpp.log.setLogLevel(clpp.log.Level.INFO);

    const videoEl = document.getElementById('video');
    const containerEl = videoEl.parentElement;
    const player = new clpp.Player(videoEl, { }, { containerEl });

    document.querySelectorAll('[data-seek]').forEach(button => {
      button.addEventListener('click', () => {
        player.setPosition(Number(button.dataset.seek));
      });
    });

    player.on('error', (event) => {
      const error = event.detail;
      if (error) {
        console.warn('Error:', error);
      }
    });

    player.open({
      source: 'https://testcontent.castlabs.com/QA/tos_1080_clear/manifest.mpd',
      startTime: 23,
      // Side-load the SRT file. The mimeType selects the SRT parser; the
      // player converts the cues to WebVTT internally.
      remoteTextTracks: [
        {
          url: 'https://demo.cf.castlabs.com/media/TOS/TOS-ml.srt',
          mimeType: 'text/srt',
          kind: 'subtitles',
          language: 'mal',
          label: 'Malayalam',
        },
      ],
      // Select the side-loaded track when playback starts.
      preferredTextLanguage: 'mal',
    });
  </script>
</head>

<body>
  <prestoplay-header back-href="../../index.html"></prestoplay-header>
  <div class="page">
    <h1>SRT subtitles</h1>
    <p class="description">Example of DASH playback with side-loaded SubRip (SRT) subtitles in Malayalam.</p>
    <div>
      <video id="video" controls crossorigin="anonymous" playsinline></video>
    </div>
    <div class="controls">
      <button data-seek="23">Seek to 0:23</button>
      <button data-seek="194">Seek to 3:14</button>
      <button data-seek="340">Seek to 5:40</button>
    </div>
  </div>
</body>
</html>
