<!DOCTYPE html>
<html lang="en">

<head>
  <title>360° video</title>
  <link rel="icon" href="data:;base64,iVBORw0KGgo=">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../node_modules/@castlabs/prestoplay/clpp.styles.css">
  <link rel="stylesheet" href="../styles.css">
  <style>
    .camera {
      color: var(--muted);
      font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
  </style>
  <!-- mux.js transmuxes the MPEG-TS segments of this HLS stream for MSE playback. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mux.js/6.3.0/mux.min.js" integrity="sha512-mC7/Okc2DQtEIn42I2mpODmNX3NSPrMiAhQt6ua3GsdMe1PRV77EjszmNdhfCriykcsPjd6omd+ZJPdXMxGGkA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script type="importmap">
    {
      "imports": {
        "@castlabs/prestoplay": "../../node_modules/@castlabs/prestoplay/cl.core.js",
        "@castlabs/prestoplay/cl.mse": "../../node_modules/@castlabs/prestoplay/cl.mse.js",
        "@castlabs/prestoplay/cl.hls": "../../node_modules/@castlabs/prestoplay/cl.hls.js",
        "@castlabs/prestoplay/cl.vr": "../../node_modules/@castlabs/prestoplay/cl.vr.js"
      }
    }
  </script>
  <script type="module" src="../components/prestoplay-header.js"></script>
  <script type="module" src="./vr.js"></script>
</head>

<body>
  <prestoplay-header back-href="../../index.html"></prestoplay-header>
  <div class="page">
    <h1>360° video</h1>
    <p class="description">Example of 360° video playback. Drag the video to look around, or use the buttons to move the camera from code.</p>
    <div>
      <video id="video" controls crossorigin="anonymous" playsinline></video>
    </div>
    <div class="controls">
      <button id="left">← Left</button>
      <button id="right">Right →</button>
      <button id="up">↑ Up</button>
      <button id="down">↓ Down</button>
      <button id="zoomIn">Zoom in</button>
      <button id="zoomOut">Zoom out</button>
      <span id="camera" class="camera"></span>
    </div>
  </div>
</body>
</html>
