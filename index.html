<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="data:;base64,iVBORw0KGgo=">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PRESTOplay Web Code Samples</title>
  <style>
    .site-header {
      background: rgb(38, 42, 53);
      padding: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .site-header img {
      height: 12px;
      display: block;
    }

    :root {
      --bg: #f5f5f5;
      --surface: #fff;
      --border: #e0e0e0;
      --text: #111;
      --muted: #666;
      --accent: #2563eb;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .page {
      max-width: 720px;
      margin: 0 auto;
      padding: 32px 16px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    ul {
      margin: 20px 0 0;
      padding: 0;
      list-style: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      background: var(--surface);
    }

    li {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }

    li:last-child {
      border-bottom: none;
    }

    a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    a:hover {
      text-decoration: underline;
    }

    .desc {
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header class="site-header">
    <img src="assets/logo.png" alt="castlabs">
  </header>
  <div class="page">
    <h1>PRESTOplay Web Code Samples</h1>
    <ul>
      <li><a href="examples/basic.html">Basic example</a> <span class="desc">— Load and play a stream with HLS/DASH support</span></li>
    </ul>
  </div>
</body>
</html>
